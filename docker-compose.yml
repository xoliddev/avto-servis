# docker compose up -d --build     (put your values in .env first: cp .env.example .env)
services:
  avtoservis:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/avtoservis.db
    ports:
      - "8080:8080"
    volumes:
      - avtoservis-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  avtoservis-data:
